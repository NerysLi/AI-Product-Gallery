<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>御签抽签筒 Demo</title>
    <style>
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html,
body {
  height: 100%;
}

body {
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text",
    "Segoe UI", sans-serif;
  background: radial-gradient(circle at top, #141827 0, #05060a 55%, #020308);
  color: #f9fafb;
  -webkit-font-smoothing: antialiased;
}

#app {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: stretch;
  justify-content: center;
  padding: 24px 16px;
}

.bg-glow {
  position: fixed;
  inset: 0;
  pointer-events: none;
  background:
    radial-gradient(circle at 50% 20%, rgba(255, 255, 255, 0.18), transparent 55%),
    radial-gradient(circle at 10% 90%, rgba(185, 68, 255, 0.24), transparent 60%),
    radial-gradient(circle at 90% 80%, rgba(64, 196, 255, 0.22), transparent 55%);
  opacity: 0.9;
  mix-blend-mode: screen;
  z-index: 0;
}

.layout {
  position: relative;
  z-index: 1;
  max-width: 960px;
  width: 100%;
  margin: auto;
  display: flex;
  flex-direction: column;
  gap: 24px;
}

.header {
  text-align: center;
}

.header h1 {
  font-size: clamp(26px, 4vw, 32px);
  letter-spacing: 0.08em;
  font-weight: 600;
  margin-bottom: 4px;
}

.header p {
  font-size: 14px;
  color: rgba(249, 250, 251, 0.7);
}

.stage {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px 0;
}

.tube-wrapper {
  position: relative;
  width: min(260px, 60vw);
  height: min(360px, 70vh);
  display: flex;
  align-items: center;
  justify-content: center;
}

.tube-shadow {
  position: absolute;
  inset: auto 10%;
  bottom: 16px;
  height: 40px;
  border-radius: 60px;
  background: radial-gradient(
    ellipse at center,
    rgba(0, 0, 0, 0.7),
    rgba(0, 0, 0, 0)
  );
  filter: blur(8px);
  transform: scaleX(1.2);
  opacity: 0.85;
}

.tube {
  position: relative;
  width: 100%;
  height: 86%;
  border-radius: 32px;
  background: linear-gradient(135deg, #3c2414 0%, #22140a 65%, #140c06 100%);
  box-shadow:
    0 22px 40px rgba(0, 0, 0, 0.75),
    0 0 0 1px rgba(255, 255, 255, 0.06);
  overflow: hidden;
  transform-origin: 50% 90%;
  transition:
    transform 0.18s ease-out,
    box-shadow 0.18s ease-out;
}

.tube::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background-image: linear-gradient(
      120deg,
      rgba(255, 255, 255, 0.14),
      transparent 55%
    ),
    repeating-linear-gradient(
      120deg,
      rgba(0, 0, 0, 0.35),
      rgba(0, 0, 0, 0.35) 1px,
      transparent 2px,
      transparent 4px
    );
  mix-blend-mode: soft-light;
  opacity: 0.4;
  pointer-events: none;
}

.tube-inner {
  position: absolute;
  inset: 10px;
  border-radius: 26px;
  background: linear-gradient(135deg, #54341e 0%, #2e1d10 70%);
  box-shadow:
    inset 0 0 0 1px rgba(255, 255, 255, 0.1),
    inset 0 12px 30px rgba(0, 0, 0, 0.65);
}

.tube-highlight {
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    to bottom,
    rgba(255, 255, 255, 0.25),
    transparent 40%
  );
  mix-blend-mode: screen;
  opacity: 0.8;
}

.tube-rim {
  position: absolute;
  top: 6%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 76%;
  height: 11%;
  border-radius: 999px;
  background: linear-gradient(90deg, #b19052 0%, #8c6a3c 40%, #d7b46e 100%);
  box-shadow:
    0 6px 12px rgba(0, 0, 0, 0.65),
    0 0 0 0.5px rgba(255, 255, 255, 0.7);
}

.tube-rim::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: inherit;
  background: radial-gradient(
    circle at 20% 0%,
    rgba(255, 255, 255, 0.7),
    transparent 60%
  );
  opacity: 0.7;
}

.tube-label {
  position: absolute;
  top: 24%;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
}

.tube-title {
  font-family: "STSong", "Songti SC", "Hiragino Mincho ProN", serif;
  font-size: 38px;
  letter-spacing: 0.24em;
  color: transparent;
  background: linear-gradient(180deg, #f7e7bd 0%, #b28c50 90%);
  background-clip: text;
  text-shadow:
    0 2px 6px rgba(0, 0, 0, 0.7),
    0 0 12px rgba(255, 241, 209, 0.5);
}

.tube-subtitle {
  margin-top: 6px;
  font-size: 11px;
  letter-spacing: 0.4em;
  text-indent: 0.4em;
  color: rgba(249, 250, 251, 0.5);
}

.tube-slips {
  position: absolute;
  inset: 22% 16% 10% 16%;
  overflow: visible;
}

.tube-slip {
  position: absolute;
  width: 18%;
  height: 70%;
  left: 50%;
  top: 8%;
  transform-origin: 50% 90%;
  border-radius: 999px;
  background: linear-gradient(180deg, #f4eee0 0%, #e1d8c3 90%);
  box-shadow:
    0 0 0 0.5px rgba(0, 0, 0, 0.08),
    0 8px 18px rgba(0, 0, 0, 0.3);
  opacity: 0.5;
}

.tube-slip::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  background: linear-gradient(
    145deg,
    rgba(255, 255, 255, 0.7),
    transparent 60%
  );
  mix-blend-mode: screen;
  opacity: 0.7;
}

.controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}

.primary-btn,
.ghost-btn {
  min-width: 210px;
  padding: 10px 22px;
  border-radius: 999px;
  border: none;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition:
    transform 0.15s ease-out,
    box-shadow 0.15s ease-out,
    background 0.15s ease-out,
    color 0.15s ease-out,
    opacity 0.15s ease-out;
}

.primary-btn {
  background: linear-gradient(135deg, #fbbf24, #f97316);
  color: #111827;
  box-shadow:
    0 10px 25px rgba(248, 181, 55, 0.45),
    0 0 0 1px rgba(250, 204, 21, 0.5);
}

.primary-btn:hover {
  transform: translateY(-1px);
  box-shadow:
    0 14px 30px rgba(248, 181, 55, 0.6),
    0 0 0 1px rgba(250, 204, 21, 0.7);
}

.primary-btn:active {
  transform: translateY(0);
  box-shadow:
    0 6px 16px rgba(248, 181, 55, 0.4),
    0 0 0 1px rgba(250, 204, 21, 0.6);
}

.ghost-btn {
  background: transparent;
  color: rgba(249, 250, 251, 0.8);
  border: 1px solid rgba(249, 250, 251, 0.35);
  box-shadow: 0 0 0 1px rgba(15, 23, 42, 0.6);
}

.ghost-btn:hover:not(:disabled) {
  background: rgba(15, 23, 42, 0.6);
}

.ghost-btn:disabled {
  opacity: 0.35;
  cursor: default;
}

.hint {
  margin-top: 4px;
  font-size: 12px;
  color: rgba(209, 213, 219, 0.75);
  text-align: center;
  line-height: 1.5;
}

.fortune-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding-bottom: 80px;
}

.fortune-slip {
  position: relative;
  width: min(360px, 86vw);
  padding: 22px 18px 20px;
  border-radius: 18px;
  background: linear-gradient(180deg, #fdf8ee 0%, #f3ecda 100%);
  box-shadow:
    0 18px 34px rgba(0, 0, 0, 0.55),
    0 0 0 1px rgba(15, 23, 42, 0.08);
  color: #111827;
  transform: translateY(40px) scale(0.94);
  opacity: 0;
  pointer-events: auto;
}

.fortune-slip.visible {
  transition:
    transform 0.45s cubic-bezier(0.18, 0.89, 0.32, 1.18),
    opacity 0.3s ease-out;
  transform: translateY(0) scale(1);
  opacity: 1;
}

.fortune-level {
  font-size: 18px;
  font-weight: 700;
  margin-bottom: 6px;
}

.fortune-level.level-great {
  color: #be181c;
}

.fortune-level.level-normal {
  color: rgba(15, 23, 42, 0.9);
}

.fortune-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 8px;
  color: rgba(15, 23, 42, 0.9);
}

.fortune-divider {
  height: 1px;
  width: 100%;
  background: linear-gradient(
    90deg,
    transparent,
    rgba(15, 23, 42, 0.12),
    transparent
  );
  margin-bottom: 10px;
}

.fortune-detail {
  font-size: 14px;
  line-height: 1.6;
  color: rgba(31, 41, 55, 0.88);
}

.tube.shaking {
  animation: tube-shake 0.45s cubic-bezier(0.36, 0.07, 0.19, 0.97) infinite;
}

.tube.pop {
  animation: tube-pop 0.28s cubic-bezier(0.3, 0.7, 0.4, 1.2);
}

@keyframes tube-shake {
  10% {
    transform: rotate(-3.5deg);
  }
  20% {
    transform: rotate(3.5deg);
  }
  30% {
    transform: rotate(-2.5deg);
  }
  40% {
    transform: rotate(2.5deg);
  }
  50% {
    transform: rotate(-1.5deg);
  }
  60% {
    transform: rotate(1.5deg);
  }
  70% {
    transform: rotate(-0.8deg);
  }
  80% {
    transform: rotate(0.8deg);
  }
  100% {
    transform: rotate(0deg);
  }
}

@keyframes tube-pop {
  0% {
    transform: translateY(2px) scale(1);
  }
  50% {
    transform: translateY(-6px) scale(1.02);
  }
  100% {
    transform: translateY(0) scale(1);
  }
}

@media (min-width: 768px) {
  .layout {
    gap: 28px;
  }

  .controls {
    flex-direction: row;
    justify-content: center;
  }

  .hint {
    margin-top: 0;
    margin-left: 16px;
    text-align: left;
  }
}
    </style>
  </head>
  <body>
    <div id="app">
      <div class="bg-glow"></div>

      <main class="layout">
        <header class="header">
          <h1>御签抽签筒</h1>
          <p>在网页里体验高级质感的抽签仪式。</p>
        </header>

        <section class="stage">
          <div class="tube-wrapper">
            <div class="tube-shadow"></div>

            <div class="tube" id="tube">
              <div class="tube-inner"></div>
              <div class="tube-highlight"></div>
              <div class="tube-rim"></div>
              <div class="tube-label">
                <div class="tube-title">御签</div>
                <div class="tube-subtitle">OMIKUJI</div>
              </div>

              <div class="tube-slips" id="tube-slips"></div>
            </div>
          </div>

          <div class="fortune-layer" id="fortune-layer">
            <div class="fortune-slip" id="fortune-slip">
              <div class="fortune-level" id="fortune-level"></div>
              <div class="fortune-title" id="fortune-title"></div>
              <div class="fortune-divider"></div>
              <div class="fortune-detail" id="fortune-detail"></div>
            </div>
          </div>
        </section>

        <section class="controls">
          <button id="shake-button" class="primary-btn">
            摇一摇抽一签
          </button>
          <button id="again-button" class="ghost-btn" disabled>
            再抽一签
          </button>

          <p class="hint">
            在电脑上可以点击「摇一摇」按钮或按下空格键；<br />
            在手机上允许访问「设备运动/方向」，可以直接摇晃手机。
          </p>
        </section>
      </main>
    </div>

    <script>
const tube = document.getElementById("tube");
const tubeSlipsContainer = document.getElementById("tube-slips");
const fortuneSlipEl = document.getElementById("fortune-slip");
const fortuneLayerEl = document.getElementById("fortune-layer");
const levelEl = document.getElementById("fortune-level");
const titleEl = document.getElementById("fortune-title");
const detailEl = document.getElementById("fortune-detail");
const shakeButton = document.getElementById("shake-button");
const againButton = document.getElementById("again-button");

let shakeEnergy = 0;
let isShaking = false;
let isDrawing = false;
let hasResult = false;

// 提高按钮/空格键每次「摇动」的能量，降低触发阈值，保证很容易抽出签
const SHAKE_INCREMENT = 40;
const SHAKE_DECAY = 0.9;
const SHAKE_THRESHOLD = 20;

const fortunes = [
  {
    level: "大吉",
    levelClass: "level-great",
    title: "前路光明",
    detail: "你最近的计划大多顺利，可大胆推进，但仍需保持谦逊与敬畏之心。"
  },
  {
    level: "中吉",
    levelClass: "level-normal",
    title: "稳中有升",
    detail:
      "脚踏实地，一步一脚印，会有意料之外的小惊喜降临在认真对待生活的人身上。"
  },
  {
    level: "小吉",
    levelClass: "level-normal",
    title: "小有波折",
    detail: "路上有一点小石子，但不会真正绊倒你，把它当作调整节奏的提醒。"
  },
  {
    level: "吉",
    levelClass: "level-normal",
    title: "保持耐心",
    detail:
      "暂时看不到明显成果，不代表没有前进，坚持一会儿，拐角后会有新风景。"
  },
  {
    level: "凶",
    levelClass: "level-normal",
    title: "适当避险",
    detail: "近期在关键决策上宜保守，多观察、多验证，给自己留下余地就是好运。"
  }
];

function createSlips() {
  const count = 10;
  for (let i = 0; i < count; i++) {
    const slip = document.createElement("div");
    slip.className = "tube-slip";
    const progress = i / (count - 1);
    const xOffset = (progress - 0.5) * 52;
    slip.style.setProperty("--base-x", `${xOffset}px`);
    slip.style.left = "50%";
    slip.style.transform = `translateX(${xOffset}px) rotate(${(Math.random() - 0.5) * 7}deg)`;
    slip.dataset.index = String(i);
    tubeSlipsContainer.appendChild(slip);
  }
}

createSlips();

function updateSlipsAnimation(strength) {
  // 抽出签并展示结果后，不再让签条一直抖动
  if (hasResult) {
    strength = Math.min(strength, 0.15);
  }
  const slips = tubeSlipsContainer.querySelectorAll(".tube-slip");
  slips.forEach((slip) => {
    const index = Number(slip.dataset.index || 0);
    const progress = index / Math.max(slips.length - 1, 1);
    const baseX = (progress - 0.5) * 52;
    const wobble =
      Math.sin(Date.now() / 120 + progress * 8) * (4 + strength * 9);
    const rotation =
      (Math.random() - 0.5) * 4 + (Math.random() - 0.5) * 14 * strength;
    slip.style.transform = `translateX(${baseX + wobble}px) rotate(${rotation}deg)`;
    slip.style.opacity = String(0.4 + 0.6 * (1 - progress));
  });
}

function triggerShake() {
  if (isDrawing) return;
  shakeEnergy += SHAKE_INCREMENT;
}

function pickRandomFortune() {
  return fortunes[Math.floor(Math.random() * fortunes.length)];
}

function showFortune() {
  const f = pickRandomFortune();
  levelEl.textContent = f.level;
  titleEl.textContent = f.title;
  detailEl.textContent = f.detail;

  levelEl.className = "fortune-level " + f.levelClass;

  fortuneSlipEl.classList.remove("visible");
  void fortuneSlipEl.offsetWidth;
  fortuneSlipEl.classList.add("visible");

  hasResult = true;
  againButton.disabled = false;
}

function resetFortune() {
  fortuneSlipEl.classList.remove("visible");
  hasResult = false;
  againButton.disabled = true;
}

function drawSequence() {
  if (isDrawing) return;
  isDrawing = true;

  tube.classList.remove("shaking");
  tube.classList.add("pop");

  setTimeout(() => {
    tube.classList.remove("pop");
    showFortune();
    isDrawing = false;
    shakeEnergy = 0;
  }, 320);
}

function loop() {
  requestAnimationFrame(loop);

  shakeEnergy *= SHAKE_DECAY;
  if (shakeEnergy < 0.05) shakeEnergy = 0;

  const strength = Math.max(0, Math.min(shakeEnergy / SHAKE_THRESHOLD, 1));
  updateSlipsAnimation(strength);

  if (!isDrawing) {
    if (strength > 0.25 && !isShaking) {
      isShaking = true;
      tube.classList.add("shaking");
    } else if (strength <= 0.12 && isShaking) {
      isShaking = false;
      tube.classList.remove("shaking");
    }
  }

  if (shakeEnergy >= SHAKE_THRESHOLD && !isDrawing && !hasResult) {
    drawSequence();
  }
}

loop();

shakeButton.addEventListener("click", () => {
  triggerShake();
});

againButton.addEventListener("click", () => {
  if (isDrawing) return;
  resetFortune();
  setTimeout(() => {
    shakeEnergy = 0;
  }, 150);
});

window.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();
    triggerShake();
  }
});

function setupDeviceMotion() {
  if (typeof DeviceMotionEvent === "undefined") return;

  const enable = () => {
    if (
      typeof DeviceMotionEvent.requestPermission === "function" &&
      location.protocol === "https:"
    ) {
      DeviceMotionEvent.requestPermission()
        .then((state) => {
          if (state === "granted") {
            window.addEventListener("devicemotion", handleMotion);
          }
        })
        .catch(() => {});
    } else {
      window.addEventListener("devicemotion", handleMotion);
    }
  };

  enable();
}

function handleMotion(event) {
  const acc = event.accelerationIncludingGravity;
  if (!acc) return;

  const ax = acc.x || 0;
  const ay = acc.y || 0;
  const az = acc.z || 0;

  const magnitude = Math.sqrt(ax * ax + ay * ay + az * az);
  const delta = Math.abs(magnitude - 9.8);

  if (delta > 3) {
    shakeEnergy += delta * 0.8;
  }
}

setupDeviceMotion();
    </script>
  </body>
  </html>
